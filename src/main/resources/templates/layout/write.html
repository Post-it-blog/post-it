<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POST-IT</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;900&display=swap"
            rel="stylesheet"
    />

    <!-- Quill CSS -->
    <link
            href="https://cdn.quilljs.com/1.3.6/quill.snow.css"
            rel="stylesheet"
    />
    <!-- 기본 헤더 CSS -->
    <link rel="stylesheet" th:href="@{/styles/header_blog.css}">
    <!-- 콘텐츠별 CSS -->
    <link rel="stylesheet" th:if="${pageCss}" th:href="@{/styles/{file}(file=${pageCss})}">
</head>
<body>
<!-- 기본 헤더 -->
<header th:replace="~{/fragments/default_header :: header}"></header>
<!-- 콘텐츠 -->
<main layout:fragment="content"></main>
</body>
</html>
