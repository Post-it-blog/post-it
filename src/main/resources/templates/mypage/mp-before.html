<main layout:fragment="content"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout/header_only}">
    <!-- My Page 헤더 -->
    <div class="header">
        <h1>My Page</h1>
    </div>

    <!-- 비밀번호 확인 박스 -->
    <form action="/mypage" method="post">
        <div class="password-box">
            <!-- 비밀번호를 입력해 주세요 라벨 -->
            <div class="label">
                <p>비밀번호를 입력해 주세요.</p>
            </div>

            <!-- 비밀번호 입력 필드 -->
            <div class="input-wrapper">
                <input type="password" class="password-input" placeholder="Password" id="passwordInput" name="pwd">
            </div>

            <!-- 에러 메시지 (숨김) -->
            <div class="error-message" id="errorMessage" th:if="${errorMsg} != null">
                비밀번호가 일치하지 않습니다.
            </div>

            <!-- 확인 버튼 -->
            <button class="confirm-button" id="confirmButton">확인</button>
        </div>
    </form>
</main>
