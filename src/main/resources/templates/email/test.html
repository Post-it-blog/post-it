<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>이메일 인증 테스트</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body { font-family: Arial; padding: 40px; }
        .box {
            width: 380px;
            margin: auto;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }
        input {
            width: 100%; padding: 10px;
            border: 1px solid #ccc; border-radius: 6px;
            margin-bottom: 15px;
        }
        button {
            width: 100%; padding: 12px;
            background: #2D6CEA; color: white;
            border: none; border-radius: 6px;
            cursor: pointer;
        }
        button:disabled {
            background: #aaa; cursor: not-allowed;
        }
        #msg {
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

<div class="box">
    <h2 style="text-align: center;">이메일 인증 테스트</h2>

    <label>이메일 입력</label>
    <input id="email" type="text" placeholder="example@gmail.com">

    <button id="sendBtn">인증코드 보내기</button>

    <br><br>

    <label>인증코드 입력</label>
    <input id="code" type="text" placeholder="메일로 받은 인증코드">

    <button id="checkBtn">코드 확인</button>

    <p id="msg"></p>
</div>


<script>
    // 인증코드 전송
    $("#sendBtn").click(function () {
        const email = $("#email").val();

        if (!email) {
            alert("이메일을 입력해 주세요.");
            return;
        }

        $.ajax({
            url: "/test/send",
            type: "POST",
            data: { email: email },
            success: function (res) {
                if (res === "TOO_FAST") {
                    $("#msg")
                        .css("color", "red")
                        .text("잠시 후 다시 시도하세요.")
                        .show();
                    return;
                }
                $("#msg")
                    .css("color", "green")
                    .text("인증코드가 이메일로 전송되었습니다.")
                    .show();
            },
            error: function () {
                $("#msg")
                    .css("color", "red")
                    .text("메일 전송 실패")
                    .show();
            }
        });
    });

    // 인증코드 확인
    $("#checkBtn").click(function () {
        const code = $("#code").val();

        if (!code) {
            alert("인증코드를 입력하세요.");
            return;
        }

        $.ajax({
            url: "/test/check",
            type: "POST",
            data: { code: code },
            success: function (res) {
                if (res === "OK") {
                    $("#msg")
                        .css("color", "green")
                        .text("인증 성공!")
                        .show();
                }
                else if (res === "TIMEOUT") {
                    $("#msg")
                        .css("color", "red")
                        .text("인증코드가 만료되었습니다. 다시 발송해 주세요.")
                        .show();
                }
                else {
                    $("#msg")
                        .css("color", "red")
                        .text("인증코드가 틀렸습니다.")
                        .show();
                }
            }
        });
    });
</script>

</body>
</html>
