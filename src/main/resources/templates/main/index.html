<main layout:fragment="content"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{/layout/default}" class="main-content">
    <!-- Section 1: Hero -->
    <section class="hero-section">
        <div class="hero-logo">
            <img src="/images/logo1.png" alt="POST-IT Logo" />
        </div>
        <h1 class="hero-title">현재를 게시하고, 미래를 영감으로 채우다.</h1>
    </section>

    <!-- Section 2: Inspiration -->
    <section class="inspiration-section">
        <div class="inspiration-background">
            <img
                    src="https://images.unsplash.com/photo-1455390582262-044cdead277a?w=1280&h=711&fit=crop"
                    alt="Background"
            />
        </div>
        <div class="inspiration-gradient"></div>
        <div class="inspiration-content">
            <p class="inspiration-text">
                당신만의 특별한 생각을 <strong>POST-IT</strong> 하세요.
            </p>
            <p class="inspiration-subtitle">
                시대를 초월하는 영감이 피어나는 우리들의 디지털 메모장.
            </p>
            <!-- [수정] 로그인 여부(myBlogId 존재 여부)에 따라 이동 경로 분기 -->
            <button class="button-start-recording"
                    th:onclick="${myBlogId != null} ? |location.href='@{/blog/{id}(id=${myBlogId})}'| : |location.href='@{/mem/login}'|">
                나만의 영감 기록 시작하기
            </button>
        </div>
    </section>

    <!-- Section 3: Blog List -->
    <section class="blog-list-section">
        <h2 class="section-heading">BLOG-LIST</h2>

        <!-- Blog Items -->
        <div class="blog-items-container">
            <!-- 검색 결과가 없을 경우 -->
            <div th:if="${blogList == null or #lists.isEmpty(blogList)}" style="width:100%; text-align:center; padding: 50px; color:#888;">
                <p>등록된 블로그가 없습니다.</p>
            </div>

            <!-- Blog Item Loop -->
            <article class="blog-item" th:each="blog : ${blogList}"
                     th:onclick="|location.href='@{/blog/{blogId}(blogId=${blog.blogId})}'|" style="cursor: pointer;">
                <div class="blog-item-content">
                    <div class="blog-author">
                        <span class="author-nickname" th:text="${blog.memberNickname}">닉네임</span>
                    </div>
                    <h3 class="blog-item-title" th:text="${blog.blogTitle}">블로그 제목</h3>
                    <p class="blog-item-description" th:text="${blog.blogDesc}">
                        블로그 소개글...
                    </p>
                </div>
                <div class="blog-item-thumbnail">
                    <img th:src="${blog.profileImg}" alt="profile" />
                </div>
            </article>
        </div>

        <!-- Search Section -->
        <div class="search-container">
            <form class="search-wrapper" action="/index" method="get">
                <div class="search-category-wrapper">
                    <select class="search-category-select" id="searchCategory" name="sc">
                        <option value="blogName" th:selected="${sc == 'blogName'}">블로그 명</option>
                        <option value="blogIntro" th:selected="${sc == 'blogIntro'}">블로그 소개</option>
                        <option value="nickname" th:selected="${sc == 'nickname'}">닉네임</option>
                    </select>
                </div>
                <div class="search-input-wrapper">
                    <input type="text" class="search-input" name="sw" th:value="${sw}" placeholder="검색어를 입력하세요" />
                </div>
                <button type="submit" class="search-button" style="border:none; background:none;">
                    <svg
                            class="search-icon"
                            width="34"
                            height="30"
                            viewBox="0 0 34 30"
                            fill="none"
                    >
                        <g clip-path="url(#clip0)">
                            <circle
                                    cx="14"
                                    cy="14"
                                    r="10"
                                    stroke="black"
                                    stroke-width="1.67"
                            />
                            <line
                                    x1="21"
                                    y1="20"
                                    x2="29"
                                    y2="28"
                                    stroke="black"
                                    stroke-width="1.67"
                            />
                        </g>
                        <defs>
                            <clipPath id="clip0">
                                <rect width="34" height="29.14" fill="white" />
                            </clipPath>
                        </defs>
                    </svg>
                </button>
            </form>
        </div>

        <!-- Pagination -->
        <div class="pagination-container" th:if="${pageInfo.totalCount > 0}" th:object="${pageInfo}">
            <!-- 이전 버튼 -->
            <button class="pagination-button pagination-prev"
                    th:if="*{prev}"
                    th:onclick="|location.href='@{/index(cp=*{startPage - 1}, sc=${sc}, sw=${sw})}'|">
                &lt;
            </button>

            <!-- 페이지 번호 -->
            <th:block th:each="page : ${#numbers.sequence(pageInfo.startPage, pageInfo.endPage)}">
                <button class="pagination-button"
                        th:classappend="${page == pageInfo.currentPage} ? 'pagination-active' : ''"
                        th:text="${page}"
                        th:onclick="|location.href='@{/index(cp=${page}, sc=${sc}, sw=${sw})}'|">
                    1
                </button>
            </th:block>

            <!-- 다음 버튼 -->
            <button class="pagination-button pagination-next"
                    th:if="*{next}"
                    th:onclick="|location.href='@{/index(cp=*{endPage + 1}, sc=${sc}, sw=${sw})}'|">
                &gt;
            </button>
        </div>
    </section>

    <!-- Section 4: Best Posts -->
    <section class="best-posts-section">
        <div class="best-posts-wrapper">
            <h2 class="best-posts-heading">BEST POST 3</h2>

            <div class="best-posts-grid">
                <th:block th:if="${bestPosts == null or #lists.isEmpty(bestPosts)}">
                    <p style="text-align:center; width:100%; color:#fff;">등록된 게시글이 없습니다.</p>
                </th:block>

                <!-- Best Post Loop -->
                <article class="best-post-card" th:each="post : ${bestPosts}"
                         th:onclick="|location.href='@{/blog/{blogId}/post/{postId}(blogId=${post.blogId}, postId=${post.postId})}'|"
                         style="cursor: pointer;">
                    <div class="best-post-image">
                        <img
                                th:if="${post.mainImageUrl != null}"
                                th:src="${post.mainImageUrl}"
                                alt="Blog Image"
                        />
                        <!-- 이미지가 없을 경우 기본 이미지 -->
                        <img
                                th:if="${post.mainImageUrl == null}"
                                src="https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=260&h=283&fit=crop"
                                alt="Default Image"
                        />
                    </div>
                    <h3 class="best-post-title" th:text="${post.title}">블로그 제목</h3>
                    <p class="best-post-author" th:text="${post.memberNickname}">블로거 명</p>
                </article>
            </div>
        </div>
    </section>

    <!-- Section 5: Closing -->
    <section class="closing-section">
        <div class="closing-background">
            <img
                    src="https://images.unsplash.com/photo-1506784983877-45594efa4cbe?w=1282&h=854&fit=crop"
                    alt="Background"
            />
        </div>
        <div class="closing-gradient"></div>
        <div class="closing-content">
            <h2 class="closing-title">No Ordinary Thoughts, No Filters.</h2>
            <div class="closing-description">
                <p>필터 없는 당신의 아이디어를 마음껏 펼치세요.</p>
                <p>복잡한 유행과 규칙에 얽매이지 않고,</p>
                <p>당신의 생각과 기록을 공유하는 공간입니다.</p>
            </div>
        </div>
    </section>
</main>
