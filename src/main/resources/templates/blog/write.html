<main layout:fragment="content"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{/layout/write}">
    <div class="container">
        <form id="postForm" th:data-blog-id="${blogId}">
            <div class="category-wrapper">
                <select class="category-select" id="categorySelect" name="categoryId">
                    <option value="">카테고리 선택</option>
                    <option th:each="category : ${categoryList}"
                            th:value="${category.categoryId}"
                            th:text="${category.categoryName}">일상</option>
                </select>
            </div>

            <!-- 제목 입력 -->
            <input
                    type="text"
                    class="title-input"
                    id="titleInput"
                    name="title"
                    placeholder="제목을 입력하세요."
            />

            <div class="editor-wrapper">
                <div id="editor"></div>
            </div>

            <div class="button-wrapper">
                <button type="button" class="post-button" id="postButton">
                    POST
                </button>
            </div>
        </form>
    </div>

    <!-- Quill JS -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

    <!-- Image Resize Module -->
    <script src="https://cdn.jsdelivr.net/npm/quill-image-resize-module@3.0.0/image-resize.min.js"></script>

    <script src="/js/write.js"></script>
</main>
