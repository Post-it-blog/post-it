<main layout:fragment="content"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{/layout/write}">
    <div class="container">
        <!-- [핵심] data-mode와 data-post-id로 수정 모드인지 알려줍니다 -->
        <form id="postForm"
              th:data-blog-id="${blogId}"
              th:data-mode="${isEdit} ? 'edit' : 'write'"
              th:data-post-id="${post != null ? post.postId : ''}">

            <!-- 카테고리 선택 -->
            <div class="category-wrapper">
                <select class="category-select" id="categorySelect" name="categoryId">
                    <option value="">카테고리 선택</option>
                    <!-- 수정 시 기존 카테고리 선택(selected) -->
                    <option th:each="category : ${categoryList}"
                            th:value="${category.categoryId}"
                            th:text="${category.categoryName}"
                            th:selected="${post != null and post.categoryId == category.categoryId}">일상</option>
                </select>
            </div>

            <!-- 제목 입력 -->
            <input
                    type="text"
                    class="title-input"
                    id="titleInput"
                    name="title"
                    placeholder="제목을 입력하세요."
                    th:value="${post != null ? post.title : ''}"
            />

            <!-- 게시글 내용 (Quill 에디터) -->
            <div class="editor-wrapper">
                <div id="editor"></div>
            </div>

            <!-- [핵심] 기존 내용 저장용 (JS에서 Quill 초기화 시 사용) -->
            <div id="existingContent" style="display:none;" th:utext="${post != null ? post.content : ''}"></div>

            <!-- 버튼 -->
            <div class="button-wrapper">
                <button type="button" class="post-button" id="postButton" th:text="${isEdit} ? 'EDIT' : 'POST'">
                    POST
                </button>
            </div>
        </form>
    </div>

    <!-- Quill JS -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill-image-resize-module@3.0.0/image-resize.min.js"></script>

    <!-- write.js 로드 -->
    <script src="/js/write.js"></script>

    <!-- [핵심] 수정 모드일 때만 실행: Quill 에디터에 기존 내용 채워넣기 -->
    <script th:if="${isEdit}">
        window.addEventListener('DOMContentLoaded', (event) => {
            // 타임리프로 렌더링된 기존 HTML 내용을 가져옴
            const existingContent = document.getElementById('existingContent').innerHTML;

            // Quill 인스턴스가 로드될 때까지 잠시 대기 후 삽입
            const checkQuillInterval = setInterval(() => {
                if (typeof quill !== 'undefined') {
                    clearInterval(checkQuillInterval);
                    // HTML 태그 그대로 에디터에 붙여넣기
                    quill.clipboard.dangerouslyPasteHTML(existingContent);
                }
            }, 100);
        });
    </script>
</main>
