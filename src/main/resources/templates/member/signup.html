<main layout:fragment="content"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout/pure}">

    <div class="signup-page">
        <!-- 로고 -->
        <a href="/">
        <div class="logo-container">
            <img src="/images/logo1.png" alt="POSTIT" class="logo-image" />
        </div>
        </a>
        <!-- 첫 번째 섹션: 아이디, 비밀번호, 비밀번호 확인 -->
        <div class="form-section section-1">
            <!-- 아이디 -->
            <div class="label-box label-id">
                <span class="label-text">아이디</span>
            </div>
            <input
                    type="text"
                    id="username"
                    class="input-field input-id"
                    placeholder="아이디"
            />

            <!-- 비밀번호 -->
            <div class="label-box label-password">
                <span class="label-text">비밀번호</span>
            </div>
            <input
                    type="password"
                    id="password"
                    class="input-field input-password"
                    placeholder="비밀번호"
            />

            <!-- 비밀번호 확인 -->
            <div class="label-box label-password-confirm">
                <span class="label-text">비밀번호 확인</span>
            </div>
            <input
                    type="password"
                    id="passwordConfirm"
                    class="input-field input-password-confirm"
                    placeholder="비밀번호 확인"
            />
        </div>

        <!-- 첫 번째 섹션 에러 메시지 -->
        <div class="error-message-container" id="firstError"></div>

        <!-- 두 번째 섹션: 이름, 닉네임 -->
        <div class="form-section section-2">
            <!-- 이름 -->
            <div class="label-box label-name">
                <span class="label-text">이름</span>
            </div>
            <input
                    type="text"
                    id="name"
                    class="input-field input-name"
                    placeholder="이름"
            />

            <!-- 닉네임 -->
            <div class="label-box label-nickname">
                <span class="label-text">닉네임</span>
            </div>
            <input
                    type="text"
                    id="nickname"
                    class="input-field input-nickname"
                    placeholder="닉네임"
            />
        </div>

        <!-- 두 번째 섹션 에러 메시지 -->
        <div class="error-message-container" id="secondError"></div>

        <!-- 세 번째 섹션: 이메일, 인증번호 -->
        <div class="form-section section-3">
            <!-- 이메일 -->
            <div class="label-box label-email">
                <span class="label-text">이메일</span>
            </div>
            <input
                    type="email"
                    id="email"
                    class="input-field input-email"
                    placeholder="이메일"
            />
            <button type="button" class="action-btn btn-send-code" id="sendCodeBtn">
                <span class="btn-text">인증번호 전송</span>
            </button>

            <!-- 인증번호 -->
            <div
                    class="label-box label-verification"
                    id="labelVerification"
                    style="display: none"
            >
                <span class="label-text">인증 번호</span>
            </div>
            <input
                    type="text"
                    id="verificationCode"
                    class="input-field input-verification"
                    placeholder="인증 번호"
                    style="display: none"
            />
            <button
                    type="button"
                    class="action-btn btn-verify-code"
                    id="verifyCodeBtn"
                    style="display: none"
            >
                <span class="btn-text">인증번호 확인</span>
            </button>
        </div>

        <!-- 세 번째 섹션 에러 메시지 -->
        <div class="error-message-container" id="thirdError"></div>

        <!-- 회원가입 버튼 -->
        <div class="submit-button-container">
            <button type="button" class="submit-btn" id="submitBtn">
                <span class="submit-btn-text">회원가입</span>
            </button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/js/signup.js"></script>
</main>
