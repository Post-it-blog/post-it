<main layout:fragment="content"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout/pure}">
    <div class="find-pwd-page">
        <!-- 로고 -->
        <div class="logo-container">
            <div class="logo-text">POSTit</div>
        </div>

        <!-- 아이디, 이메일, 인증번호 섹션 -->
        <div class="form-section section-form">
            <!-- 아이디 -->
            <div class="label-box label-id">
                <span class="label-text">아이디</span>
            </div>
            <input
                    type="text"
                    id="userId"
                    class="input-field input-id"
                    placeholder="아이디"
            />

            <!-- 이메일 -->
            <div class="label-box label-email">
                <span class="label-text">이메일</span>
            </div>
            <input
                    type="email"
                    id="email"
                    class="input-field input-email"
                    placeholder="이메일"
            />
            <button type="button" class="action-btn btn-send-code" id="sendCodeBtn">
                <span class="btn-text">인증번호 전송</span>
            </button>

            <!-- 인증번호 -->
            <div class="label-box label-verification" id="labelVerification" style="display: none;">
                <span class="label-text">인증 번호</span>
            </div>
            <input
                    type="text"
                    id="verificationCode"
                    class="input-field input-verification"
                    placeholder="인증번호"
                    style="display: none;"
            />
            <button
                    type="button"
                    class="action-btn btn-verify-code"
                    id="verifyCodeBtn"
                    style="display: none;"
            >
                <span class="btn-text">인증번호 확인</span>
            </button>
        </div>

        <!-- 에러 메시지 -->
        <div class="error-message-container" id="errorMessage"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/js/find-pwd.js"></script>
    <script>
        // 팝업창 크기 고정
        window.addEventListener('load', function() {
          if (window.opener) {
            // 팝업창인 경우에만 실행
            window.resizeTo(630, 450);

            // resize 이벤트 감지하여 원래 크기로 복원
            let resizeTimer;
            window.addEventListener('resize', function() {
              clearTimeout(resizeTimer);
              resizeTimer = setTimeout(function() {
                window.resizeTo(630, 450);
              }, 100);
            });
          }
        });
    </script>
</main>
