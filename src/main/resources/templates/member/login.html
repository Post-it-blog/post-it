<main layout:fragment="content"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout/header_only}">
    <div class="container">
        <div class="login-card">
            <!-- 로고 -->
            <header class="logo">
                <a href="/">
                    <img src="/images/logo1.png" alt="POSTit Logo" />
                </a>
            </header>
            <form action="/mem/login" method="post" th:object="${loginReq}">
                <!-- 입력 폼 영역 -->
                <div class="form-container">
                    <!-- ID 입력 -->
                    <div class="input-row">
                        <div class="input-label">
                            <span>ID</span>
                        </div>
                        <div class="input-field">
                            <input type="text" id="username" placeholder="아이디" th:field="*{userId}" />
                        </div>
                    </div>

                    <!-- Password 입력 -->
                    <div class="input-row">
                        <div class="input-label">
                            <span>Password</span>
                        </div>
                        <div class="input-field">
                            <input type="password" id="password" placeholder="패스워드" th:field="*{password}" />
                        </div>
                    </div>
                </div>

                <!-- 에러 메시지 -->
                <div class="error-message2" th:if="${errorMsg != null}" th:text="${errorMsg}">아이디 또는 비밀번호가 잘못되었습니다.</div>
                <div class="error-message"></div>

                <!-- 로그인 버튼 -->
                <button type="submit" class="login-button">로그인</button>
            </form>

            <!-- 하단 링크 -->
            <div class="footer-links">
                <a href="#" class="link" id="findIdLink">아이디 찾기</a>
                <span class="divider"></span>
                <a href="#" class="link" id="findPwdLink">비밀번호 찾기</a>
                <span class="divider"></span>
                <a href="/mem/signup" class="link">회원가입</a>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.querySelector('form');
        const errorMessage = document.querySelector('.error-message');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorMessage2 = document.querySelector('.error-message2');
        const findIdLink = document.getElementById('findIdLink');
        const findPwdLink = document.getElementById('findPwdLink');

        // Form 제출 시 유효성 검사
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault(); // 기본 제출 동작 막기

            if (errorMessage2 != null) {
                errorMessage2.classList.add('show');
            }

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();


            // 아이디 검사
            if (username.length === 0) {
                errorMessage.textContent = '아이디를 입력해주세요.';
                errorMessage.classList.add('show');
                return;
            }

            // 비밀번호 검사
            if (password.length === 0) {
                errorMessage.textContent = '비밀번호를 입력해주세요.';
                errorMessage.classList.add('show');
                return;
            }

            // 유효성 검사 통과 시 실제 제출
            errorMessage.classList.remove('show');
            loginForm.submit();
        });

        // 아이디 찾기 팝업 열기
        findIdLink.addEventListener('click', function(e) {
            e.preventDefault();
            openFindIdPopup();
        });

        function openFindIdPopup() {
            // 팝업 창 크기 설정
            const width = 630;
            const height = 400;

            // 화면 중앙에 팝업 위치 계산
            const left = (screen.width - width) / 2;
            const top = (screen.height - height) / 2;

            // 팝업 옵션
            // resizable=no : 크기 조절 불가
            // scrollbars=yes : 스크롤바 필요시 표시
            const options = `
                width=${width},
                height=${height},
                left=${left},
                top=${top},
                resizable=no,
                scrollbars=yes,
                status=no,
                menubar=no,
                toolbar=no,
                location=no
            `;

            // 팝업 열기
            window.open('/mem/findId', 'FindIdPopup', options);
        }

        // 아이디 찾기 팝업 열기
        findPwdLink.addEventListener('click', function(e) {
            e.preventDefault();
            openFindPwdPopup();
        });

        function openFindPwdPopup() {
            // 팝업 창 크기 설정
            const width = 630;
            const height = 400;

            // 화면 중앙에 팝업 위치 계산
            const left = (screen.width - width) / 2;
            const top = (screen.height - height) / 2;

            // 팝업 옵션
            // resizable=no : 크기 조절 불가
            // scrollbars=yes : 스크롤바 필요시 표시
            const options = `
                width=${width},
                height=${height},
                left=${left},
                top=${top},
                resizable=no,
                scrollbars=yes,
                status=no,
                menubar=no,
                toolbar=no,
                location=no
            `;

            // 팝업 열기
            window.open('/mem/findPwd', 'FindPwdPopup', options);
        }
    </script>
</main>
