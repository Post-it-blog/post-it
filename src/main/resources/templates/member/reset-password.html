<main layout:fragment="content"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout/pure}">
    <div class="reset-password-page">
        <th:block th:if="${close} != null">
            <script>window.close();</script>
        </th:block>
        <!-- 로고 -->
        <div class="logo-container">
            <div class="logo-text">POSTit</div>
        </div>

        <!-- 비밀번호 재설정 섹션 -->
        <form class="form-section section-password" action="/mem/pwdChange" method="post" th:object="${pwdChangeReq}">
            <!-- 새 비밀번호 -->
            <div class="input-row">
                <div class="label-box label-new-password">
                    <span class="label-text">새 비밀번호</span>
                </div>
                <input
                        type="password"
                        id="newPassword"
                        class="input-field input-new-password"
                        placeholder="새 비밀번호 입력"
                        th:field="*{newPwd}"
                />
            </div>

            <!-- 새 비밀번호 확인 -->
            <div class="input-row">
                <div class="label-box label-confirm-password">
                    <span class="label-text">새 비밀번호 확인</span>
                </div>
                <input
                        type="password"
                        id="confirmPassword"
                        class="input-field input-confirm-password"
                        placeholder="새 비밀번호 확인"
                        th:field="*{newPwdConfirm}"
                />
            </div>

            <!-- 에러 메시지 -->
            <div class="error-message-container" id="errorMessage"></div>
            <div
                    id="errorMessage2"
                    class="error-message-container2"
                    th:classappend="${errorMsg} != null ? ' visible' : ''"
                    th:text="${errorMsg}">
            </div>

            <!-- 확인 버튼 -->
            <button type="submit" class="confirm-btn" id="confirmBtn">
                <span class="btn-text">확인</span>
            </button>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        // 비밀번호 정규식
        const pwdRegex = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[!@#$%^&*()_+\-=])\S{8,16}$/;

        // DOM 요소
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const errorMessageDiv = document.getElementById('errorMessage');

        const errorMessage2 = document.getElementById('errorMessage2');

        function hideServerMessage() {
            if (errorMessage2 && errorMessage2.classList.contains('visible')) {
                errorMessage2.classList.remove('visible');
            }
        }

        newPasswordInput.addEventListener('input', hideServerMessage);
        confirmPasswordInput.addEventListener('input', hideServerMessage);

        // 폼 데이터
        let formData = {
          newPassword: '',
          confirmPassword: ''
        };

        // 에러 상태
        let errors = {
          newPassword: [],
          confirmPassword: []
        };

        // 입력 변경 핸들러
        function handleInputChange(field, value) {
          formData[field] = value;
        }

        // blur 핸들러
        function handleBlur(field) {
          const value = formData[field].trim();
          let errorMsg = '';

          if (field === 'newPassword') {
            if (value && !pwdRegex.test(value)) {
              errorMsg = '비밀번호: 8~16자의 영문자, 숫자, 특수문자의 조합을 사용해 주세요.<br>(사용 가능한 특수문자: !@#$%^&*()_+-=)';
            }
          } else if (field === 'confirmPassword') {
            if (value && formData.newPassword !== value) {
              errorMsg = '비밀번호 확인: 비밀번호가 일치하지 않습니다.';
            }
          }

          errors[field] = errorMsg ? [errorMsg] : [];
          updateUI();
        }

        // UI 업데이트
        function updateUI() {
          const allErrors = [...errors.newPassword, ...errors.confirmPassword];

          if (allErrors.length > 0) {
            errorMessageDiv.classList.add('visible');
            errorMessageDiv.innerHTML = allErrors.map(err => `<div>${err}</div>`).join('');
          } else {
            errorMessageDiv.classList.remove('visible');
            errorMessageDiv.innerHTML = '';
          }
        }

        // 이벤트 리스너 등록
        newPasswordInput.addEventListener('input', (e) => handleInputChange('newPassword', e.target.value));
        newPasswordInput.addEventListener('blur', () => handleBlur('newPassword'));

        confirmPasswordInput.addEventListener('input', (e) => handleInputChange('confirmPassword', e.target.value));
        confirmPasswordInput.addEventListener('input', () => handleBlur('confirmPassword'));

        // 초기 UI 설정
        updateUI();

        // 팝업창 크기 고정
        window.addEventListener('load', function() {
          if (window.opener) {
            // 팝업창인 경우에만 실행
            window.resizeTo(630, 450);

            // resize 이벤트 감지하여 원래 크기로 복원
            let resizeTimer;
            window.addEventListener('resize', function() {
              clearTimeout(resizeTimer);
              resizeTimer = setTimeout(function() {
                window.resizeTo(630, 450);
              }, 100);
            });
          }
        });
    </script>
</main>
