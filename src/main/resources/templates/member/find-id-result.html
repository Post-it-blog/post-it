<main layout:fragment="content"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout/pure}">
    <div class="result-page">
        <!-- 로고 -->
        <div class="logo-container">
            <div class="logo-text">POSTit</div>
        </div>

        <!-- 결과 섹션 -->
        <div class="result-section">
            <!-- 메시지 및 아이디 -->
            <div class="message-container">
                <span class="message-text">회원님의 아이디는</span>
                <div class="id-display" id="userIdDisplay" th:text="${userId}">
                </div>
                <span class="message-text">입니다.</span>
            </div>

            <!-- 확인 버튼 -->
            <button type="button" class="confirm-btn" id="confirmBtn" onclick="window.close()">
                <span class="btn-text">확인</span>
            </button>
        </div>
    </div>
</main>
